# ==============================================================================
# DocArch AI - Liquibase Configuration Properties
# ==============================================================================
# ChangeLog File
changeLogFile=liquibase/changelog.master.xml

# PostgreSQL Database Connection URL (Supabase or Local PostgreSQL)
# Example: jdbc:postgresql://db.<supabase-project-id>.supabase.co:5432/postgres?sslmode=require
url=${DB_URL:-jdbc:postgresql://localhost:5432/postgres}

# Database Credentials
username=${DB_USER:-postgres}
password=${DB_PASSWORD:-postgres}

# Driver configuration
driver=org.postgresql.Driver
classpath=drivers/postgresql-42.7.3.jar

# Liquibase Execution Options
logLevel=INFO
showSummary=SUMMARY

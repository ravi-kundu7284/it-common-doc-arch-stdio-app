version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docarch-postgres-local
    restart: always
    environment:
      POSTGRES_DB: docarch_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docarch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    container_name: docarch-postgrest-local
    restart: always
    ports:
      - "54321:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgrespassword@postgres:5432/docarch_db
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
